<!doctype html>
<html lang="en" translate="no">
  <head>

    <title>Singing · Songs and games for English class</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="css/singing.css?v=1" />

  <body>
    <header class="topbar" id="topbar">
      <a class="brand" href="#/"><span class="brand-mic" aria-hidden="true">🎤</span> Singing</a>
      <nav class="topnav" aria-label="Main">
        <a href="#/" data-nav="library">Songs</a>
        <a href="#/studio" data-nav="studio" hidden>Studio</a>
        <a href="#/assignments" data-nav="assignments" hidden>Assignments</a>

        <a href="#/party" data-nav="party">Party</a>

    <main id="app" class="container" tabindex="-1"></main>
